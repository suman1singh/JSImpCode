    <!-- <script>
      //2:sort an array without any methood:quick sort
      function quickSort(arr) {
        if (arr.length <= 1) return arr;
        let pivot = arr[arr.length - 1]; // Choosing last element as pivot
        let left = [],
          right = [];
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] < pivot) left.push(arr[i]);
          else right.push(arr[i]);
        }
        return [...quickSort(left), pivot, ...quickSort(right)];
      }

      let arr = [5, 3, 8, 1];
      console.log(quickSort(arr)); // Output: [1, 3, 5, 8]
    </script> -->

      function largestSum(arr, num) {
        if (num > arr.length) {
          return "invalid";

        let times = arr.length - num + 1;
        for (let i = 0; i < times; i++) {
          let tempsum = 0;

      //Q.6: Divide and Conquer Technique in Binary Search
      function binarySearchIterative(arr, target) {
        let left = 0;
        let right = arr.length - 1;
        while (left <= right) {
          let mid = Math.floor((left + right) / 2);
          if (arr[mid] === target) return mid;
          if (arr[mid] < target) {
            left = mid + 1;
          } else {
            right = mid - 1;
          }
        }
        return "not found";
      }
      console.log(binarySearchIterative([1, 3, 5, 7, 9, 11], 7)); // Output: 3

    <script>
      //Q.9: Checking Square in another array
      //With DSA: with one loop
      //Time complexity: o(n): linear
      let arr1 = [1, 2, 4, 2];
      let arr2 = [1, 4, 16, 4];
      const checkIsSquare = (arr1, arr2) => {
        let obj1 = {};
        let obj2 = {};
        for (let ch of arr1) {
          obj1[ch] = (obj1[ch] || 0) + 1;
        }
        for (let ch of arr2) {
          obj2[ch] = (obj2[ch] || 0) + 1;
        }
        console.log(obj1);
        console.log(obj2);
        for (let key in obj1) {
          if (!obj2[key * key]) {
            return false;
          }
          if (obj1[key] !== obj2[key * key]) {
            return false;
          }
        }
        return true;
      };
      console.log(checkIsSquare(arr1, arr2));
    </script>
