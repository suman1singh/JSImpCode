    <!-- <script>
      //2:sort an array without any methood:quick sort
      function quickSort(arr) {
        if (arr.length <= 1) return arr;
        let pivot = arr[arr.length - 1]; // Choosing last element as pivot
        let left = [],
          right = [];
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] < pivot) left.push(arr[i]);
          else right.push(arr[i]);
        }
        return [...quickSort(left), pivot, ...quickSort(right)];
      }

      let arr = [5, 3, 8, 1];
      console.log(quickSort(arr)); // Output: [1, 3, 5, 8]
    </script> -->

    <!-- <script>
      //Q.6: Divide and Conquer Technique in Binary Search
      function binarySearchIterative(arr, target) {
        let left = 0;
        let right = arr.length - 1;
        while (left <= right) {
          let mid = Math.floor((left + right) / 2);
          if (arr[mid] === target) return mid;
          if (arr[mid] < target) {
            left = mid + 1;
          } else {
            right = mid - 1;
          }
        }
        return "not found";
      }
      console.log(binarySearchIterative([1, 3, 5, 7, 9, 11], 7)); // Output: 3
    </script> -->

      //Advance Recursive function | Sorting
      // Sorting using recursive function
      //[2,3,1,4] ==> By default case
      let arr = [2, 3, 1, 4];
      let sortedArr = [];
      let i = 0;
      let j = 1;

      function isSorted(arr) {
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] > arr[i + 1]) {
            return false;
          }
        }
        return true;
      }
      console.log("is sorted?", isSorted(arr));

      function sortArray(arr) {
        if (isSorted(arr)) {
          sortedArr = arr;
          return;
        } else if (arr[i] < arr[j]) {
          i++;
          j++;
          sortArray(arr);
        } else {
          [arr[i], arr[j]] = [arr[j], arr[i]];
          i = 0;
          j = 1;
          sortArray(arr);
        }
      }
      sortArray(arr);
      console.log(sortedArr);
      //simple way:
      console.log("---------------------");
      //recursive bubble sort algorithm
      function recursiveBubbleSort(arr, n = arr.length) {
        if (n === 1) return arr; // Base case: If only one element, return

        for (let i = 0; i < n - 1; i++) {
          if (arr[i] > arr[i + 1]) {
            // Swap elements if out of order
            [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]];
          }
        }

        // Recursive call for remaining elements
        return recursiveBubbleSort(arr, n - 1);
      }

      // Example usage:
      const arr1 = [5, 3, 8, 4, 2];
      console.log(recursiveBubbleSort(arr1)); // Output: [2, 3, 4, 5, 8]
