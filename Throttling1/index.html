    <script>
      const getEnabled = () => {
        document.getElementById("myid").disabled = false;
      };

      const throuttling = (callback, delay) => {
        return () => {
          document.getElementById("myid").disabled = true;
          setTimeout(() => {
            callback();
          }, delay);
        };
      };

      const newFun = throuttling(getEnabled, 1500);
    </script>
