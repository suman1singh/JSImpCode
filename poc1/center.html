<!DOCTYPE html>
<html>
  <head>
    <!-- <h1>vertically and horizontally center element</h1> -->
    <style>
      body {
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center; /*keeps child horizontally center*/
        align-items: center; /*keeps child vertically center*/
      }
      .box {
        height: 300px;
        width: 300px;
        background-color: aqua;
        display: flex;
        justify-content: center; /*keeps child horizontally center*/
        align-items: center; /*keeps child vertically center*/
      }
      .hori-vert-center {
        background-color: pink;
        border: 2px solid rgb(241, 6, 6);
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box"><h1 class="hori-vert-center">Suman Singh</h1></div>
  </body>
</html>
